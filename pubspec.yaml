name: tree_notes
description: "类 Apple Notes + Workflowy 结合体的树状分支笔记本 App"
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: '>=3.3.0 <4.0.0'

dependencies:
flutter:
    sdk: flutter

  # ===== 状态管理 =====
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ===== 数据库：Isar（支持嵌套对象 / 全文搜索 / 高效树状查询） =====
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # ===== 富文本编辑器（原生实现，禁止 WebView） =====
  flutter_quill: ^9.3.20

  # ===== 代码块语法高亮 =====
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # ===== UI 效果 =====
  google_fonts: ^6.2.1
  uuid: ^4.4.0

  # ===== 分享 / 导出 =====
  share_plus: ^9.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ===== 代码生成（Isar Schema + Riverpod） =====
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
